name: auto build engine

on: 
  release:
    types: [published]
  schedule:
    - cron: "0 16 * * *"
  push:
    branches: 
      - master
  watch:
    types: [started]
  workflow_dispatch:
   
jobs:
  build-mainline:
    runs-on: ubuntu-26.04
    
    steps:
    - name: Install ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: build-mainline
        max-size: 2048M
        evict-old-files: 1d
    
    - name: Install build depedencies
      run: |
        sudo apt update
        sudo apt install -y flex bison libelf-dev dwarves
    
    - name: Bulid kernel
      run: |
        git clone https://github.com/torvalds/linux.git --depth 1 linux
        wget --no-check-certificate https://raw.githubusercontent.com/ActiveIce/WSL2-Linux-Kernel/master/dxgkrnl.patch
        wget --no-check-certificate https://raw.githubusercontent.com/ActiveIce/WSL2-Linux-Kernel/master/fix.patch
        pushd linux
        patch ../dxgkrnl.patch < ../fix.patch
        git apply ../dxgkrnl.patch --reject
        wget --no-check-certificate -P Microsoft https://raw.githubusercontent.com/microsoft/WSL2-Linux-Kernel/linux-msft-wsl-6.18.y/arch/x86/configs/config-wsl
        scripts/config --file Microsoft/config-wsl -e USB -e USBIP_CORE -e USBIP_VHCI_HCD
        make olddefconfig KCONFIG_CONFIG=Microsoft/config-wsl
        make -j$(nproc) KCONFIG_CONFIG=Microsoft/config-wsl LOCALVERSION="" CC="ccache gcc"
        cp ./arch/x86/boot/bzImage ./arch/x86/boot/bzImage-mainline
        popd
    
    - name: Upload kernel
      uses: actions/upload-artifact@main
      with:
        name: bzImage-mainline
        path: linux/arch/x86/boot/bzImage-mainline

  build-msft:
    runs-on: ubuntu-26.04
    
    steps:
    - name: Install ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: build-msft
        max-size: 2048M
        evict-old-files: 1d
    
    - name: Install build depedencies
      run: |
        sudo apt update
        sudo apt install -y flex bison libelf-dev dwarves
    
    - name: Bulid kernel
      run: |
        git clone https://github.com/microsoft/WSL2-Linux-Kernel --depth 1
        pushd WSL2-Linux-Kernel
        scripts/config --file Microsoft/config-wsl -e USB -e USBIP_CORE -e USBIP_VHCI_HCD
        make olddefconfig KCONFIG_CONFIG=Microsoft/config-wsl
        make -j$(nproc) KCONFIG_CONFIG=Microsoft/config-wsl LOCALVERSION="" CC="ccache gcc"
        popd
    
    - name: Upload kernel
      uses: actions/upload-artifact@main
      with:
        name: bzImage
        path: WSL2-Linux-Kernel/arch/x86/boot/bzImage
